<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1B3B9E"/>

  <!-- Letter M -->
  <text x="32" y="52"
        font-family="'Arial Black','Arial',sans-serif"
        font-weight="900"
        font-size="44"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-1">M</text>

  <!-- Graduation cap board (sits on top of M) -->
  <polygon points="32,6 52,14 32,22 12,14" fill="#F5A623"/>
  <!-- Cap board highlight -->
  <polygon points="32,6 52,14 42,10 32,9 22,10 12,14" fill="#ffffff" opacity="0.2"/>
  <!-- Cap body under board -->
  <rect x="24" y="14" width="16" height="10" rx="1.5" fill="#1B4FD8"/>
  <!-- Gold band on cap -->
  <path d="M24,19 Q32,24 40,19" stroke="#F5A623" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Tassel cord -->
  <path d="M50,14 Q55,15 54,21 Q53,26 52,29" stroke="#F5A623" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Tassel knot -->
  <circle cx="52" cy="30" r="2" fill="#F5A623"/>
  <!-- Tassel strands -->
  <line x1="50" y1="30" x2="48" y2="36" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="51" y2="38" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="31" x2="56" y2="37" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
</svg>
