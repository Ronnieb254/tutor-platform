<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">

  <!-- ── Graduation cap (sits above the M) ── -->
  <!-- Board -->
  <polygon points="38,8 66,18 38,28 10,18" fill="#1B3B9E"/>
  <!-- Board highlight -->
  <polygon points="38,8 66,18 52,13 38,12 24,13 10,18" fill="#ffffff" opacity="0.18"/>
  <!-- Cap body -->
  <rect x="24" y="18" width="28" height="18" rx="2" fill="#1B4FD8"/>
  <!-- Side shadow -->
  <rect x="24" y="18" width="9" height="18" rx="2" fill="#0E2A8A" opacity="0.3"/>
  <!-- Gold arch -->
  <path d="M24,30 Q38,40 52,30" stroke="#F5A623" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tassel cord -->
  <path d="M64,18 Q72,20 70,30 Q68,38 66,44" stroke="#F5A623" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Tassel knot -->
  <circle cx="66" cy="45" r="3" fill="#F5A623"/>
  <!-- Tassel strands -->
  <line x1="63" y1="45" x2="60" y2="54" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="66" y1="48" x2="65" y2="57" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="69" y1="46" x2="71" y2="55" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ── "Mwalimu" text — hat sits above the M ── -->
  <text x="10" y="74"
        font-family="'Arial Black','Arial',sans-serif"
        font-weight="900"
        font-size="50"
        fill="#1B3B9E"
        letter-spacing="-1.5">Mwalimu</text>
</svg>
