# Redis Configuration for Mwalimu Platform

# Enable appendonly file for persistence
appendonly yes
appendfilename "appendonly.aof"

# Save snapshots
save 900 1
save 300 10
save 60 10000

# Maximum memory policy (useful for cache)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Network
bind 0.0.0.0
protected-mode yes

# If you want to enable password authentication, uncomment below and set a password:
# requirepass your_secure_password_here

# For better performance
tcp-backlog 511
timeout 0
tcp-keepalive 300
